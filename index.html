<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CW screening</title>
    <link rel="icon" type="image/x-icon" href="B.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0d3d5c 0%, #1a5a7a 50%, #0d4a6b 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            animation: slideInUp 0.6s ease-out;
            border: 1px solid rgba(13, 61, 92, 0.1);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            background: linear-gradient(135deg, #0a2d42 0%, #0d3d5c 50%, #0f4a70 100%);
            color: white;
            text-align: center;
            padding: 35px 20px;
            font-size: 2.2em;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            border-bottom: 3px solid #1a6a9c;
        }

        form {
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(2, 320px);
            justify-content: center;
            gap: 25px;
            background: linear-gradient(180deg, #ffffff 0%, #f0f7fa 100%);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e8f0f5;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .input-group:hover {
            border-color: #1a6a9c;
            box-shadow: 0 4px 12px rgba(13, 61, 92, 0.1);
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #0d3d5c;
            font-size: 0.95em;
            letter-spacing: 0.3px;
            position: relative;
        }

        label::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #0d3d5c, #1a6a9c);
            transition: width 0.3s ease;
        }

        .input-group:focus-within label::after {
            width: 100%;
        }

        input[type="number"],
        select {
            padding: 14px 16px;
            border: 2px solid #c5dbe6;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8fcff;
            font-family: inherit;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #0d3d5c;
            box-shadow: 0 0 0 3px rgba(13, 61, 92, 0.15);
            background: white;
            transform: translateY(-1px);
        }

        input[type="number"]:hover,
        select:hover {
            border-color: #1a6a9c;
            background: white;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-right: 40px;
        }

        button {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #0d3d5c, #1a6a9c, #0d4a6b);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(13, 61, 92, 0.4);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(13, 61, 92, 0.5);
        }

        button:active {
            transform: translateY(0) scale(1);
        }

        h2 {
            background: linear-gradient(135deg, #0a2d42, #0d3d5c, #0f4a70);
            color: white;
            padding: 25px 40px;
            font-size: 1.6em;
            font-weight: 600;
            border-top: 3px solid #1a6a9c;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 0.95em;
        }

        thead {
            background: linear-gradient(135deg, #0a2d42 0%, #0d3d5c 100%);
        }

        th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
            color: white;
            border-bottom: 2px solid #1a6a9c;
            font-size: 0.9em;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            transition: all 0.2s ease;
            font-weight: 500;
            color: #2d3748;
            text-align: center;
        }

        th {
            padding: 18px 15px;
            text-align: center;
            font-weight: 600;
            color: white;
            border-bottom: 2px solid #1a6a9c;
            font-size: 0.9em;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        tbody tr:hover {
            background: linear-gradient(135deg, #e8f4f8 0%, #d1e8f0 100%);
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(13, 61, 92, 0.15);
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:nth-child(even):hover {
            background: linear-gradient(135deg, #e8f4f8 0%, #d1e8f0 100%);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 15px;
            }

            h1 {
                font-size: 1.8em;
                padding: 25px 15px;
            }

            form {
                padding: 25px;
                grid-template-columns: 1fr;
                gap: 20px;
            }

            h2 {
                padding: 20px 25px;
                font-size: 1.4em;
            }

            table {
                font-size: 0.85em;
            }

            th,
            td {
                padding: 12px 10px;
            }

            /* Make table horizontally scrollable on mobile */
            .table-container {
                overflow-x: auto;
                margin: 0 -20px;
            }

            table {
                min-width: 700px;
            }
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0d3d5c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Enhanced focus styles for accessibility */
        input:focus-visible,
        select:focus-visible,
        button:focus-visible {
            outline: 2px solid #0d3d5c;
            outline-offset: 2px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #e8f4f8;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #0d3d5c, #1a6a9c);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #0a2d42, #0f4a70);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 1.1em;
            background: linear-gradient(180deg, #f8fcff 0%, #f0f7fa 100%);
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .csa-result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, #eaf4ff, #f7fbff);
            border: 1px solid #cfe3f5;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .csa-title {
            font-size: 1rem;
            font-weight: 600;
            color: #0d3d5c;
            margin-bottom: 8px;
        }

        .csa-value {
            font-size: 2rem;
            font-weight: 700;
            color: #d35400;
        }

        .csa-value small {
            font-size: 1rem;
            color: #555;
        }

        .row-4-bobbins {
            background-color: #e3f2fd !important;
        }

        .row-2-bobbins {
            background-color: #e8f5e9 !important;
        }

        .row-1-bobbin {
            background-color: #fff3e0 !important;
        }

        /* ==========================

    position:relative;

    border:2px solid #ff9800;

    </style>
</head>

<body>
    <div class="container">
        <h1>CWS Wire Screening Configuration Calculator</h1>

        <!-- قسم مدخلات حساب مساحة المقطع للنحاس -->
        <div class="adiabatic-section"
            style="background-color: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #ddd; ">
            <h3 style="margin-top: 0; color: #333;">CSA Calculation</h3>

            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">


                <!-- المدخلات الأساسية -->
                <div class="input-group">

                    <label for="scType">
                        Short-Circuit Current Type:
                    </label>

                    <select id="scType">

                        <option value="adiabatic" selected>
                            Adiabatic (I_AD)
                        </option>

                        <option value="nonadiabatic">
                            Non-Adiabatic (I_NON)
                        </option>

                    </select>
                    <small id="scInfo"></small>

                </div>

                <div class="input-group important-input" id="ctsGroup">

                    <label>

                        <input type="checkbox" id="considerCTS">

                        Consider Copper Tape in
                        Short-Circuit handling

                    </label>

                </div>

                <div class="input-group important-input" id="iscGroup">
                    <label for="Iad" style="display: block; margin-bottom: 5px;">Short Circuit Current (I<sub>sc</sub>)
                        [KA]:</label>
                    <input type="number" id="Isc" placeholder="Enter the needed Short-circuit Current ">
                </div>

                <div class="input-group" id="tGroup">
                    <label for="t" >Short-circuit duration t (s):</label>
                    <input type="number" id="t" value="1" step="0.01">
                </div>

                <div class="input-group" id="thetaIGroup">
                    <label for="thetaI">θᵢ (°C):</label>
                    <input type="number" id="thetaI" value="80" step="0.1">
                </div>

                <div class="input-group" id="thetaFGroup">
                    <label for="thetaF">θf (°C):</label>
                    <input type="number" id="thetaF" value="200" step="0.1">
                </div>


                <!-- قيم ثابتة للنحاس (مخفية لضمان عمل الـ JS) -->
                <input type="hidden" id="K" value="226">
                <input type="hidden" id="beta" value="234.5">

                <div class="input-group" style="display: none;">
                    <label for="material">Screen Material:</label>
                    <select id="material">
                        <option value="Cu" selected>Copper</option>
                        <option value="Al">Aluminium</option>
                        <option value="Pb">Lead Alloy</option>
                        <option value="Steel">Steel</option>
                    </select>
                </div>

                <div class="input-group" id="surroundingGroup">
                    <label for="surrounding">Surrounding Material:</label>
                    <select id="surrounding">
                        <option value="PVC" selected>PVC</option>
                        <option value="PE">PE</option>
                        <option value="LS0H">LS0H</option>
                        <option value="SC">Semi-conductive</option>
                    </select>
                </div>



                <div class="input-group" id="FGroup">
                    <label for="F">Thermal contact factor F (0.7 recommended):</label>
                    <input type="number" id="F" value="0.5" step="0.01">
                </div>

            </div>


            <!-- Calculate Button -->
            <div style="margin-top:20px; text-align:center;">

                <button type="button" id="calculateCSAButton" onclick="calculateRequiredArea()">

                    Calculate Required CSA

                </button>

            </div>



            <div class="csa-result-box">

                <div class="csa-title">
                    Required CSA (S) Adiabetic assumption

                </div>

                <div class="csa-value">
                    <span id="S_result">--</span>
                    <small>mm²</small>
                </div>

            </div>

        </div>


        <form id="wireForm">


            <div class="input-group">
                <label for="neededArea">Cross-sectional Area Needed (mm²):</label>
                <input type="number" id="neededArea" step="0.01" required>
            </div>

            <div class="input-group">
                <label for="underDiameter">Diameter Under Screening (mm):</label>
                <input type="number" id="underDiameter" step="0.01" required>
            </div>

            <button type="submit">Find the optimum construction</button>
        </form>

        <h2>Results</h2>

        <div class="table-container">
            <table id="resultsTable">
                <thead>
                    <tr>

                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr>
                        <td colspan="9" class="empty-state">
                            <div class="empty-state-icon">⚡</div>
                            Enter values above and click Calculate to see results
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        document.getElementById("wireForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const neededArea = parseFloat(document.getElementById("neededArea").value);
            const underDiameter = parseFloat(document.getElementById("underDiameter").value);

            const material = document.getElementById("material").value;     // screen
            const surrounding = document.getElementById("surrounding").value;
            const thetaI = parseFloat(document.getElementById("thetaI").value);
            const thetaF = parseFloat(document.getElementById("thetaF").value);
            const t = parseFloat(document.getElementById("t").value);
            const F = parseFloat(document.getElementById("F").value);
            const scType = document.getElementById("scType").value;
            if (
                [neededArea, underDiameter, thetaI, thetaF, t, F].some(
                    (v) => isNaN(v) || v <= 0
                )
            ) {
                alert("Please enter valid numeric values.");
                return;
            }

            // ---- constants (from your spec) ----
            const conductorData = {
                Cu: { K: 226, beta: 234.5, sigmaC: 3.45 },
                Al: { K: 148, beta: 228.0, sigmaC: 2.50 },
                Pb: { K: 41, beta: 230.0, sigmaC: 1.45 },     // lead alloy
                Steel: { K: 78, beta: 202.0, sigmaC: 3.80 }
            };

            const surroundData = {
                PVC: { sigma: 1.7, rho: 5.0 },
                PE: { sigma: 2.4, rho: 3.5 },
                LS0H: { sigma: 1.7, rho: 5.0 },
                SC: { sigma: 2.4, rho: 2.5 }
            };

            // empirical constants for ε per IEC 60949 (clause 5)
            const C1 = 2464;              // mm/m
            const C2 = 1.22;              // K·m·mm²/J

            // helper: format numbers
            const fx = (n, d = 2) => Number(n).toLocaleString(undefined, { maximumFractionDigits: d });

            const { K, beta, sigmaC } = conductorData[material];
            const { sigma, rho } = surroundData[surrounding];


            const resultsTable = document.querySelector("#resultsTable tbody");
            resultsTable.innerHTML = "";

            const standardDiameters = [0.5, 0.54, 0.55, 0.58, 0.6, 0.61, 0.615, 0.62, 0.66, 0.664,
                0.67, 0.672, 0.735, 0.76, 0.77, 0.82, 0.85, 0.9, 0.91, 0.92,
                0.93, 0.98, 1, 1.01, 1.03, 1.037, 1.05, 1.06, 1.09, 1.17, 1.19, 1.2, 1.31, 1.35, 1.36, 1.365, 1.37, 1.385, 1.4,
                1.47, 1.5, 1.52, 1.53, 1.57, 1.6, 1.62, 1.63, 1.68, 1.7, 1.74, 1.78, 1.8, 1.82, 1.83, 1.9, 1.921, 1.96, 2, 2.01, 2.05,
                2.1, 2.12, 2.19, 2.2, 2.22, 2.24, 2.32, 2.33, 2.46, 2.48, 2.5, 2.52, 2.58, 2.59, 2.6, 2.82, 2.85, 2.9, 2.91, 2.915,
                2.96, 3.33, 3.57, 3.76, 3.84, 4.2];

            const lnTerm = Math.log((thetaF + beta) / (thetaI + beta));   // dimensionless
            const A = (C1 / (sigmaC * Math.pow(10, 6))) * Math.sqrt((((sigma + 2.4) / 2) * Math.pow(10, 6)) / ((rho + 2.5) / 2));//always semi con below screen (2.4 and 2.5 values)
            const B = (C2 / (sigmaC * Math.pow(10, 6))) * (((sigma + 2.4) / 2) * Math.pow(10, 6)) / ((rho + 2.5) / 2);//always semi con below screen (2.4 and 2.5 values)


            //*******************************dynamic headers **********************************************************
            const tableHead = document.querySelector("#resultsTable thead tr");
            if (scType === "adiabatic") {

                tableHead.innerHTML = `
            <th>Nb Wires × Nb Bobbins × Wire Ø (mm)</th>
            <th>Calculated Area S (mm²)</th>
            <th>Gap (mm)</th>
            <th>Weight (Kg)</th>
            <th>I_AD (kA)</th>
            <th>I_AD + CTS (kA)</th>
            
        `;

            } else {

                tableHead.innerHTML = `
            <th>Nb Wires × Nb Bobbins × Wire Ø (mm)</th>
            <th>Calculated Area S (mm²)</th>
            <th>Gap (mm)</th>
            <th>Weight (Kg)</th>
            <th>I_NON (kA)</th>
            <th>I_NON + CTS (kA)</th>
            <th>ε</th>
        `;
            }

            //itration starts here ****************************************************************************************

            let allRows = [];
            standardDiameters.forEach(diameter => {
                const wireArea = Math.PI / 4 * diameter * diameter;
                const tempNbWires = Math.ceil(neededArea / wireArea);

                let possibleBobbins = [];
                //************************************************************* Bobbin configurations***************
                if (diameter < 1.3) {
                    possibleBobbins = [4, 2, 1];
                } else {
                    possibleBobbins = [1];
                }
                //******************************************************************************************

                possibleBobbins.forEach(nbBobbins => {

                    const scType =
                        document.getElementById("scType").value;

                    const Isc =
                        parseFloat(
                            document.getElementById("Isc").value
                        );
                    const considerCTS =document.getElementById("considerCTS").checked;

                    //=================================================
                    // Initial configuration
                    //=================================================

                    let nbElements =
                        Math.ceil(
                            tempNbWires / nbBobbins
                        );

                    let totalNbWires =
                        nbElements * nbBobbins;

                    let areaCalculated =wireArea * totalNbWires;

                    let gapCalculated =(Math.PI *(underDiameter + diameter)/totalNbWires)-(1.03 * diameter);

                    let weight =areaCalculated * 8.89;

                    //=================================================
                    // currents
                    //=================================================

                    let Iad =(K *areaCalculated *Math.sqrt(lnTerm / t)) / 1000;

                    let Iad_without =(K *(areaCalculated + 1.5) *Math.sqrt(lnTerm / t)) / 1000;

                    let eps =Math.sqrt(1 +(F * A *Math.sqrt(t / wireArea))+((F * F) *B *(t / wireArea)));

                    let Inon = eps * Iad;

                    let Inon_without = eps * Iad_without;
                    let targetCurrent = considerCTS?Inon_without:Inon;

                    //=================================================
                    // ADIABATIC
                    //=================================================

                    if (scType === "adiabatic") {

                        const validGap = gapCalculated > 0.1 && gapCalculated < 4;

                        const validWireLimit =(totalNbWires < 126 &&diameter < 1.35)||(totalNbWires < 104 && diameter >= 1.35 && diameter < 2 )||(totalNbWires < 84 && diameter >= 2);
                        const validArea =(areaCalculated /neededArea) < 1.1;
                        if (!validGap ||!validWireLimit || !validArea) {

                            return;
                        }

                    }

                    //=================================================
                    // NON ADIABATIC
                    //=================================================

                    if (scType === "nonadiabatic") {
                        let stopSearching = false;
                        let assumedArea = neededArea;
                        //-------------------------------------------------
                        // STEP 1
                        // Reduce CSA
                        //-------------------------------------------------
                        while (assumedArea >wireArea) {

                            assumedArea -= 0.5;
                            let tempWires =Math.ceil(assumedArea /wireArea);
                            let tempElements =Math.ceil(tempWires /nbBobbins);
                            let tempTotal =tempElements *nbBobbins;
                            let tempArea = tempTotal * wireArea;
                            let tempIad =(K *tempArea *Math.sqrt(lnTerm / t)) / 1000;

                            let tempInon =eps *tempIad;
                            let tempInon_without=eps*((K*(tempArea+1.5)*Math.sqrt(lnTerm/t))/1000);
                            let tempTargetCurrent=considerCTS?tempInon_without:tempInon;
                            if (tempTargetCurrent < Isc) {
                                assumedArea += 0.5;
                                break;
                            }

                        }

                        //-------------------------------------------------
                        // STEP 2
                        // Check limitations
                        //-------------------------------------------------

                        let accepted = false;

                        while (!accepted) {
                            let tempWires =Math.ceil(assumedArea /wireArea);
                            let tempElements =Math.ceil(tempWires /nbBobbins);
                            let tempTotal =tempElements *nbBobbins;
                            let tempArea =tempTotal * wireArea;
                            let tempGap =(Math.PI *(underDiameter +diameter)/tempTotal)-(1.03 *diameter);

                            let tempIad =(K *tempArea *Math.sqrt(lnTerm / t)) / 1000;

                            let tempInon =eps *tempIad;
                            let tempInon_without=eps*((K*(tempArea+1.5)*Math.sqrt(lnTerm/t))/1000);
                            let tempTargetCurrent=considerCTS?tempInon_without:tempInon;

                            const validGap =tempGap > 0.1 &&tempGap < 4;

                            const validWireLimit =(tempTotal < 126 &&diameter < 1.35)||(tempTotal < 104 && diameter >= 1.35 && diameter < 2)||(tempTotal < 84 &&diameter >= 2);

                            const validCurrent = tempTargetCurrent >= Isc && tempTargetCurrent <=Isc * 1.2;

                            if (validGap && validWireLimit && validCurrent) {

                                accepted = true;

                                nbElements = tempElements;

                                totalNbWires = tempTotal;

                                areaCalculated = tempArea;

                                gapCalculated = tempGap;

                            }

                            else {

                                assumedArea += 0.5;

                            }

                            if (tempTargetCurrent  >Isc * 1.2) {
                                stopSearching = true;
                                break;
                            }

                        }
                        if(stopSearching){
                            return;
                        }

                        //------------------------------------
                        // final update
                        //------------------------------------

                        weight = areaCalculated * 8.89;

                        Iad = ( K * areaCalculated * Math.sqrt( lnTerm / t ) ) / 1000;

                        Iad_without =( K * (areaCalculated + 1.5)*Math.sqrt(lnTerm / t ) ) / 1000;

                        Inon =eps * Iad;

                        Inon_without =eps * Iad_without;
                        targetCurrent =considerCTS?Inon_without:Inon;

                    }

                    //=================================================
                    // create row
                    //=================================================

                    const row =
                        resultsTable.insertRow();

                    const commonColumns = `

        <td>
        ${nbElements}
        ×
        ${nbBobbins}
        ×
        ${diameter.toFixed(3)}
        </td>

        <td>
        ${fx(areaCalculated, 3)}
        </td>

        <td>
        ${fx(gapCalculated, 3)}
        </td>

        <td>
        ${fx(weight, 3)}
        </td>
    `;

        if (scType === "adiabatic") {

            row.innerHTML = `

            ${commonColumns}

            <td style="
            background:#d4edda;
            font-weight:bold
            ">
            ${fx(Iad, 3)}
            </td>

            <td>
            ${fx(Iad_without, 3)}
            </td>
            `;

        } else {
            const considerCTS =
            document.getElementById("considerCTS").checked;
            const nonClass =
            considerCTS
            ?
            ""
            :
            "highlight-current";

            const nonCTSClass =
            considerCTS
            ?
            "highlight-current"
            :
            "";

            row.innerHTML = `

            ${commonColumns}

            <td class="${nonClass}">
                ${fx(Inon,3)}
            </td>

            <td class="${nonCTSClass}">
                ${fx(Inon_without,3)}
            </td>

            <td>
            ${fx(eps, 3)}
            </td>
            `;}

            allRows.push({

            row: row,

            area: areaCalculated

        });

    });

        });
            allRows.sort((a, b) => a.area - b.area);
            allRows.slice(0, 5).forEach(item => {

                item.row.style.backgroundColor =
                    "#ffe082";

                item.row.style.fontWeight =
                    "bold";
    });
});











        //*****************************************************************************************************************************
        // =======================================
        // CSA Calculation
        // =======================================

        function calculateRequiredArea() {

            const Isc = 1000 * parseFloat(
                document.getElementById("Isc").value
            );

            const scType =
                document.getElementById("scType").value;

            const t = parseFloat(
                document.getElementById("t").value
            );

            const thetaI = parseFloat(
                document.getElementById("thetaI").value
            );

            const thetaF = parseFloat(
                document.getElementById("thetaF").value
            );

            const K = parseFloat(
                document.getElementById("K").value
            );

            const beta = parseFloat(
                document.getElementById("beta").value
            );

            // Validation
            if (
                isNaN(Isc) ||
                isNaN(t) ||
                isNaN(thetaI) ||
                isNaN(thetaF) ||
                Isc <= 0 ||
                t <= 0
            ) {

                alert("Please enter valid values.");

                return;
            }

            // Additional validation
            if (thetaF <= thetaI) {

                alert("θf must be greater than θi");

                return;
            }

            // ======================================
            // Effective Current
            // ======================================

            let effectiveIsc = Isc;

            // If entered current is NON-ADIABATIC
            // convert to equivalent ADIABATIC current

            if (scType === "nonadiabatic") {

                const assumedEpsilon = 1;

                effectiveIsc = Isc / assumedEpsilon;
            }

            // ln term
            const lnTerm = Math.log(
                (thetaF + beta) /
                (thetaI + beta)
            );

            // CSA calculation
            const S = Math.sqrt(
                (Math.pow(effectiveIsc, 2) * t) /
                (Math.pow(K, 2) * lnTerm)
            );

            // Show result
            document.getElementById("S_result").innerHTML =
                S.toFixed(2);

            // Assign value to main calculator input
            document.getElementById("neededArea").value =
                S.toFixed(2);
        }

        //info to help users know the epsilon assumed is 1
        const scInfo =
            document.getElementById("scInfo");

        document.getElementById("scType")
            .addEventListener("change", function () {

                if (this.value === "nonadiabatic") {

                    scInfo.innerHTML ="Equivalent adiabatic current is calculated using ε = 1";

                } else {

                    scInfo.innerHTML = "";
                }
            });
